name: Pipeline Check

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  check-python-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python files
        run: python -m py_compile Scripts/main.py Scripts/extract.py Scripts/transform.py Scripts/load.py Scripts/forecast.py